<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LeetSensei emblem">
  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e63946"/>
      <stop offset="1" stop-color="#a51c28"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f4efe3"/>
      <stop offset="0.55" stop-color="#cfc7b6"/>
      <stop offset="1" stop-color="#8d8577"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f6f1e4"/>
      <stop offset="0.7" stop-color="#ded6c4"/>
      <stop offset="1" stop-color="#b7ae9c"/>
    </radialGradient>
  </defs>

  <!-- Hanko seal: the crimson ground the mark is cut into. -->
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#seal)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="11" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Crescent moon: the upper mass, with the seal showing through as the shadow. -->
  <path d="M40.5 12.5a20 20 0 1 0 0 39 21.5 21.5 0 0 1 0-39Z" fill="url(#moon)"/>

  <!-- Katana stroke: the lower arc continues as a blade, cut by the moon's shadow. -->
  <path d="M18.5 43.5 45.5 16.5" stroke="#0b0c10" stroke-opacity="0.35" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M19.5 44.5 46.5 17.5" stroke="url(#steel)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="18.5" cy="45.5" r="2.6" fill="#0b0c10" fill-opacity="0.5"/>

  <!-- Glint where the blade crosses the seal rim. -->
  <path d="M38.5 25.5 42 22" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>
</svg>
