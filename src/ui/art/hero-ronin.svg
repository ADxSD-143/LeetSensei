<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Deepest Obsidian Ink Wash Silhouette Gradient -->
    <linearGradient id="roninInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141822"/>
      <stop offset="40%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#040507"/>
    </linearGradient>

    <!-- Katana Steel Blade Gradient -->
    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#eae4d4"/>
      <stop offset="70%" stop-color="#9aa5b4"/>
      <stop offset="100%" stop-color="#3c4554"/>
    </linearGradient>

    <!-- Katana Hamon Line (Temper pattern) -->
    <linearGradient id="bladeHamon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d4e0ee" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- ==================== THE SHADOW RONIN (PRECISE REFERENCE B RECREATION) ====================
       Back/3/4 rear silhouette of the wandering swordsman standing proudly on the mountain cliff:
       - Torso & Robes: (x=900 to x=975, y=180 to y=336).
       - Solid shoulders & draped kimono collar.
       - Head & Chonmage topknot: (x=926 to x=946, y=142 to y=180).
       - Wide trailing kimono sleeve / haori fluttering to the right in shredded ink brush strokes: (x=940 to x=1055, y=190 to y=275).
       - Left scabbard pointing backward: (x=940 down to x=1005).
       - Right drawn blade extending downward & forward to the left/front: (x=905 down to x=840).
  -->

  <g id="ronin-masterpiece">
    <!-- Main Full Robe / Hakama Silhouette (Solid, organic brush stroke form) -->
    <path fill="url(#roninInk)"
          d="M932 176
             C925 180 916 190 910 205
             C905 218 903 238 906 265
             C908 285 904 310 900 336
             L958 336
             C956 322 958 305 962 292
             C968 274 974 256 978 240
             C982 225 982 210 978 198
             C974 186 965 178 954 174
             C948 172 938 172 932 176 Z"/>

    <!-- Dynamic Flowing Right Kimono Sleeve (Fluttering backward in wind, matching Reference B) -->
    <path fill="url(#roninInk)"
          d="M968 195
             C982 200 998 208 1014 216
             C1032 224 1052 230 1068 226
             C1054 235 1038 242 1022 245
             C1042 248 1060 245 1074 238
             C1058 250 1038 258 1016 262
             C1032 265 1046 263 1056 258
             C1040 270 1018 280 996 284
             C982 286 968 282 958 274
             C966 258 972 238 974 218 Z"/>

    <!-- Slender Head with Traditional Topknot (Chonmage) viewed from 3/4 rear profile -->
    <!-- Collar & Solid Neck -->
    <path fill="#080a0f" d="M932 168 L948 168 L950 180 L930 180 Z"/>
    
    <!-- Cranium / Head (Natural oval shape, perfectly proportioned to shoulders) -->
    <path fill="#040507"
          d="M932 152
             C928 152 925 158 926 166
             C927 172 933 177 940 177
             C947 177 952 172 953 166
             C954 158 950 152 944 152
             C940 151 936 151 932 152 Z"/>

    <!-- Samurai Topknot (Chonmage bun standing atop head) -->
    <path fill="#040507"
          d="M936 152 C933 147 932 140 936 135 C940 130 948 130 950 135 C952 140 950 146 945 151 Z"/>
    <rect x="938" y="142" width="4.5" height="2.5" rx="0.5" fill="#c49a45"/>

    <!-- Wisps of hair caught in wind -->
    <path d="M932 156 C926 158 920 162 914 167" stroke="#040507" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M934 146 C928 144 922 147 916 152" stroke="#040507" stroke-width="1.4" stroke-linecap="round" fill="none"/>

    <!-- Feet anchored firmly onto cliff edge at y=336 -->
    <ellipse cx="916" cy="336" rx="9" ry="3.5" fill="#030406"/>
    <ellipse cx="948" cy="336" rx="9" ry="3.5" fill="#030406"/>

    <!-- Left Katana Scabbard (Saya) jutting back through belt -->
    <path d="M950 236 L1004 266" stroke="#161b24" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M1000 264 L1005 267" stroke="#b89a62" stroke-width="6.5" stroke-linecap="round"/>

    <!-- ==================== DRAWN RIGHT KATANA ====================
         Extending forward/downwards to the right (Reference B posture):
         Right hand holding hilt at (962, 238).
         Blade extends from (968, 243) to (1048, 305).
         Angle is 37.8° downwards-right, blade length ~100px.
    -->
    <circle cx="962" cy="238" r="4.2" fill="#040507"/>
    <!-- Tsuka (Hilt) -->
    <line x1="954" y1="231" x2="964" y2="240" stroke="#040507" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="953" y1="230" x2="956" y2="233" stroke="#b89a62" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Tsuba (Guard) -->
    <ellipse cx="966" cy="241" rx="2.5" ry="5.5" transform="rotate(-37.8 966 241)" fill="#b89a62"/>
    <ellipse cx="966" cy="241" rx="1.5" ry="4" transform="rotate(-37.8 966 241)" fill="#1c2028"/>
    <!-- Blade Back (Mune) -->
    <path d="M969 243 Q1006 272 1052 308" stroke="#222b38" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    <!-- Blade Steel Core -->
    <path d="M970 244 Q1007 273 1053 309" stroke="url(#bladeSteel)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Hamon (Tempered Edge catching moonlight) -->
    <path d="M971 245 Q1008 274 1054 310" stroke="url(#bladeHamon)" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==================== LUNAR RIM LIGHTING ====================
       Scintillating backlight tracing the silhouette against the giant moon.
  -->
  <g fill="none" stroke-linecap="round">
    <!-- Topknot & Head Backlight -->
    <path d="M934 136 C940 131 948 132 950 137" stroke="#fffaee" stroke-opacity="0.85" stroke-width="1.6"/>
    <path d="M927 155 C925 163 930 172 938 175" stroke="#fffaee" stroke-opacity="0.75" stroke-width="1.5"/>
    
    <!-- Left Shoulder & Robe Edge -->
    <path d="M930 176 C918 184 908 198 906 215" stroke="#f0e9d8" stroke-opacity="0.65" stroke-width="1.5"/>
    <path d="M904 225 C902 250 904 285 900 336" stroke="#e9e2d2" stroke-opacity="0.45" stroke-width="1.3"/>
    
    <!-- Right Sleeve Wing Highlight -->
    <path d="M968 195 C988 204 1015 215 1040 220" stroke="#e9e2d2" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M1020 245 C1045 248 1065 243 1074 238" stroke="#f0e9d8" stroke-opacity="0.6" stroke-width="1.3"/>

    <!-- Katana blade tip sparkle -->
    <circle cx="1053" cy="309" r="1.4" fill="#ffffff" opacity="0.85"/>
  </g>
</svg>
