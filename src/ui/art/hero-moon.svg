<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <!-- Deep atmospheric halo with soft lunar luminescence -->
    <radialGradient id="lunarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8eb" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#e9e2d2" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#8ba0b8" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#e63946" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>

    <!-- Rich multi-stop lunar disc gradient with authentic sumi-e crater texture tone -->
    <radialGradient id="lunarBody" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fffaee"/>
      <stop offset="45%" stop-color="#f0e9d8"/>
      <stop offset="80%" stop-color="#d6cca8"/>
      <stop offset="100%" stop-color="#a89d84"/>
    </radialGradient>

    <!-- Shading mask for moon craters and surface topography -->
    <linearGradient id="lunarShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c9bda4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#706450" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Ink cloud wash passing softly in front of moon -->
    <linearGradient id="inkCloudFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0c12" stop-opacity="0"/>
      <stop offset="30%" stop-color="#0a0c12" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0a0c12" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0c12" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Giant cinematic moon: Positioned at cx=920, cy=180, r=168 (optimal framing behind ronin at cx=920) -->
  <!-- Outer glowing corona -->
  <circle cx="920" cy="180" r="320" fill="url(#lunarAura)"/>
  
  <!-- Main celestial body -->
  <circle cx="920" cy="180" r="168" fill="url(#lunarBody)"/>
  
  <!-- Lunar surface texture (seas, maria, craters in traditional woodblock / sumi-e style) -->
  <g fill="#93866d" opacity="0.32">
    <!-- Oceanus Procellarum / Sea of Serenity organic blotches -->
    <path d="M840 120 c20 -15 65 -10 85 8 c15 14 30 12 45 5 c20 -9 45 -5 50 15 c5 18 -10 32 -25 38 c-25 10 -40 2 -60 12 c-22 11 -35 28 -55 22 c-25 -8 -45 -35 -48 -58 c-2 -18 3 -32 8 -42 Z"/>
    <path d="M960 170 c18 -8 42 -2 55 12 c12 14 18 32 10 46 c-9 16 -30 20 -48 15 c-16 -5 -28 -18 -32 -32 c-4 -15 2 -32 15 -41 Z"/>
    <path d="M890 230 c15 -10 35 -6 45 8 c8 11 6 25 -4 35 c-12 12 -32 14 -44 5 c-11 -8 -12 -22 -6 -32 c3 -5 5 -10 9 -16 Z"/>
    <circle cx="830" cy="195" r="16" opacity="0.5"/>
    <circle cx="995" cy="130" r="14" opacity="0.45"/>
    <circle cx="950" cy="115" r="10" opacity="0.4"/>
    <circle cx="875" cy="165" r="12" opacity="0.35"/>
    <circle cx="980" cy="250" r="18" opacity="0.5"/>
    <circle cx="860" cy="270" r="14" opacity="0.4"/>
  </g>

  <!-- Delicate lunar rim highlight -->
  <circle cx="920" cy="180" r="168" fill="none" stroke="#fffcf5" stroke-opacity="0.6" stroke-width="1.8"/>
</svg>
